    <meta charset="utf-8" />

      name="description"
      content="GRME - Facial Analysis and Habit Tracking App"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>GRME - Facial Analysis</title>
    
    <!-- Text visibility fix CSS -->
    <link rel="stylesheet" href="%PUBLIC_URL%/fix-text.css">
    
    <!-- Reset script - clears supabase storage when URL has ?reset=true -->
    <script>
      // Check for reset parameter in URL
      if (window.location.search.includes('reset=true')) {
        console.log('Reset parameter detected, clearing Supabase storage...');
        
        try {
          // Find all Supabase-related keys
          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && (
              key.includes('supabase') || 
              key.includes('sb-') ||
              key.includes('connection') ||
              key.includes('auth') ||
              key.includes('offline')
            )) {
              keysToRemove.push(key);
            }
          }
          
          // Remove the keys
          console.log('Removing ' + keysToRemove.length + ' cached items');
          keysToRemove.forEach(key => {
            console.log('- Removing: ' + key);
            localStorage.removeItem(key);
          });
          
          // Also clear session storage
          sessionStorage.clear();
          
          console.log('Storage cleared - redirecting to clean URL');
          
          // Redirect to the same URL without the reset parameter
          const cleanUrl = window.location.href.replace(/[?&]reset=true/, '');
          window.location.href = cleanUrl;
        } catch (error) {
          console.error('Error clearing storage:', error);
        }
      }
    </script>
    
    <!-- Supabase connection and styling fixes -->
    <script src="%PUBLIC_URL%/fix-supabase.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
